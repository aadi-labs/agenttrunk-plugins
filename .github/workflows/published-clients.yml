name: Check published package metadata
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact published version to verify
        required: true
        type: string
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/published-clients.mjs
        env:
          RELEASE_VERSION: ${{ inputs.version }}
