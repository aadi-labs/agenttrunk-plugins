name: Test clients
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run sdk:check
      - run: npm run cli:check
      - run: npm run sdk:postprocess:check
      - run: npm test
      - run: npm run validate
      - run: npm run test:package

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv run --python '${{ matrix.python }}' --with ./sdk/python python -m unittest discover -s test/python -v
      - run: uv build ./sdk/python
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: sdk/go/go.sum
      - run: go test ./... -run TestAgentTrunk
        working-directory: sdk/go
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path sdk/rust/Cargo.toml --test agenttrunk_safety --test contract_regressions
      - run: cargo check --manifest-path sdk/rust/Cargo.toml --examples
  ruby:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby: ['3.3', '4.0']
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - run: gem install minitest --no-document
      - run: ruby -I sdk/ruby/lib test/ruby/test_agenttrunk.rb
      - run: ruby -I sdk/ruby/lib test/ruby/test_agent_auth.rb
      - run: gem build AgentTrunk.gemspec
        working-directory: sdk/ruby
  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path sdk/swift --filter AgentTrunkSafetyTests
