[package]
name = "agenttrunk"
version = "0.1.0"
edition = "2021"
description = "Official Rust SDK for the AgentTrunk API."
license = "MIT"
repository = "https://github.com/aadi-labs/agenttrunk-plugins"
documentation = "https://docs.rs/agenttrunk"

[lib]
doctest = false

[dependencies]
sha2 = "0.10"
bytes = "1.0"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "stream", "gzip", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }

[dev-dependencies]
base64 = "0.22"
ctor = "0.2"
tokio-test = "0.4"

